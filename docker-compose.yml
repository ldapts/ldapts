services:
  openldap:
    image: osixia/openldap:2.6.15@sha256:b804ae8b3f3e50be7315916e929ad7b21897a2f7eb3a482096967f509c61d264
    # libldap checks a localhost URL's certificate against the container hostname
    hostname: ldap.local
    ports:
      - '389:3890'
      - '636:6360'
    volumes:
      - ./tests/data/ldif/config/:/container/services/openldap-bootstrap/assets/ldif/config/custom/
      - ./tests/data/ldif/data/:/container/services/openldap-bootstrap/assets/ldif/data/custom/
      - ./tests/data/certs/:/container/services/openldap/assets/certs/
    environment:
      OPENLDAP_BOOTSTRAP_ORGANIZATION: ldap.local
      OPENLDAP_BOOTSTRAP_SUFFIX: dc=ldap,dc=local
      OPENLDAP_BOOTSTRAP_SCHEMAS: core.ldif cosine.ldif inetorgperson.ldif nis.ldif
      OPENLDAP_BOOTSTRAP_MODULES: back_mdb.so ppolicy.so sssvlv.so
      OPENLDAP_BOOTSTRAP_FRONTEND_PASSWORD_HASH: '{SSHA}'
      # 1234
      OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED: '{SSHA}deF9wfMzChtry+z7ZelF5wtHAJGZ2npJ'
      OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED: '{SSHA}deF9wfMzChtry+z7ZelF5wtHAJGZ2npJ'
      OPENLDAP_BOOTSTRAP_TLS: true
      OPENLDAP_BOOTSTRAP_TLS_CERT: /container/services/openldap/assets/certs/server.pem
      OPENLDAP_BOOTSTRAP_TLS_CERT_KEY: /container/services/openldap/assets/certs/server-key.pem
      OPENLDAP_BOOTSTRAP_TLS_CA_CERT: /container/services/openldap/assets/certs/ca.pem
      OPENLDAP_BOOTSTRAP_TLS_VERIFY_CLIENT: allow
      OPENLDAP_BOOTSTRAP_TLS_PROTOCOL_MIN: '3.3'
    healthcheck:
      test: LDAPTLS_CACERT=/container/services/openldap/assets/certs/ca.pem ldapsearch -x -H ldaps://localhost:6360 -b dc=ldap,dc=local -D "cn=admin,dc=ldap,dc=local" -w 1234 -s base objectclass=* || exit 1
      interval: 60s
      retries: 60
      start_period: 5s
      start_interval: 1s
      timeout: 3s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
